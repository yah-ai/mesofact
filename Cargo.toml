# mesofact is its own Cargo workspace — it lives under yah/external/ during
# early iteration but is intended to move to its own repo. yah's `.gitignore`
# excludes `external/`, so this tree carries independent git history.
[workspace]
members = [
    # The feed-ingest half of the freshness contract (R746-T10, moved here from
    # oss/yubaba 2026-08-14). mesofact renders; almanac fetches. They ship as one
    # pair of node runtime assets, so they release together — see the crate's
    # own manifest for the full rationale.
    "crates/almanac",
    "crates/mesofact-core",
    "crates/mesofact-publisher",
    "crates/mesofact-dev",
    "crates/mesofact-build",
    "crates/mesofact-render",
    "crates/mesofact-ssr",
    "crates/mesofact",
]
resolver = "2"

# The shipped framework binary statically links V8 (~139MB librusty_v8.a);
# stripping symbols cuts the release binary from ~75MB to ~57MB (R449-T4).
[profile.release]
strip = true

[workspace.package]
version = "0.8.29"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/mesofact"
