# mesofact is its own Cargo workspace — it lives under yah/external/ during
# early iteration but is intended to move to its own repo. yah's `.gitignore`
# excludes `external/`, so this tree carries independent git history.
[workspace]
members = [
    # The feed-ingest half of the freshness contract (R746-T10, moved here from
    # oss/yubaba 2026-08-14). mesofact renders; almanac fetches. They ship as one
    # pair of node runtime assets, so they release together — see the crate's
    # own manifest for the full rationale.
    "crates/almanac",
    "crates/mesofact-core",
    "crates/mesofact-publisher",
    "crates/mesofact-dev",
    # The `mes` command — three lines over `mesofact_dev::cli::run()`. It is a
    # package of its own rather than a `[[bin]]` in `mesofact-dev` because
    # `cargo install` takes a package name (MFT-R822); see its manifest.
    "crates/mes",
    "crates/mesofact-build",
    "crates/mesofact-render",
    "crates/mesofact-ssr",
    "crates/mesofact",
    # Stage 2 of R757, the npm resolver (W318 / R773). Two crates, split so the
    # part that is plural is separable from the part that is npm: `jsget` knows
    # which registries exist and how each spells a package name, `rnpm` knows
    # the npm protocol and (from R773-F2 on) the resolution algorithm. WORKING
    # TITLES — R757 names them on the way out, and both carry
    # `publish = false` until it does.
    #
    # The dependency edge runs jsget -> rnpm -> (nothing in this workspace).
    # `rnpm` must NOT gain a `mesofact-build` dependency: `mesofact-build` will
    # consume `jsget`, so the reverse edge is a cycle. Tarball acquisition
    # stays in `mesofact-build`'s `install.rs`/`store.rs`; the resolver's output
    # is the `dist.integrity` + `dist.tarball` pair that path already takes.
    "crates/jsget",
    "crates/rnpm",
]
resolver = "2"

# The shipped framework binary statically links V8 (~139MB librusty_v8.a);
# stripping symbols cuts the release binary from ~75MB to ~57MB (R449-T4).
# --- profiles: keep in lockstep with the yah monorepo root Cargo.toml ---
#
# `exclude = ["oss", "external"]` in the root makes this a genuine separate
# workspace, so it inherits NOTHING from it — until 2026-09-12 everything here
# built at cargo's defaults (`debug = true`, `opt-level = 0`) for the entire
# dependency graph. Two reasons that was wrong:
#
#   Disk. Full DWARF on every dependency is what made `oss/yubaba/target` 16G
#   and `oss/cheers/target` 11G, nearly all of it debuginfo nobody reads in
#   this camp. `line-tables-only` keeps the part that IS consumed — file:line
#   backtraces and panic locations — and drops the type/variable DWARF.
#
#   sccache. Its cache key includes rustc flags, so one dependency compiled at
#   `debug = true` here and `debug = false` from the root is two entries for
#   one crate, and every cross-workspace hit was silently lost.
#
# Changing these invalidates every prior artifact and sccache entry for this
# workspace (different flags -> different hashes); that was the point. If you
# need to single-step a dependency, override it per-package locally rather
# than reverting the `"*"` glob.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
# W308/R745-T1: `-C incremental` makes sccache refuse a crate outright. This
# glob applies to DEPENDENCIES and never to workspace members, so crates you
# edit here keep incremental and crates you merely consume become cacheable.
incremental = false

[profile.release]
strip = true

[workspace.package]
version = "0.8.40"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/mesofact"
