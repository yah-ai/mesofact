[package]
name = "mesofact-dev"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Dev-tier affordances for mesofact workloads — rebuild-on-change watcher + a local S3 surface standing in for R2, plus the `mesofact-dev` binary. The serving engine lives in the `mesofact` facade; this crate must never be in a prod binary's dependency closure (W225 §2)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "mesofact-dev"
path = "src/main.rs"

# NOTE: the prod `mesofact-serve` bin used to live here. It moved to the
# `mesofact` facade — its presence in this crate is exactly what forced the prod
# binary to link the watcher + dev S3 surface, breaking W225 §2's dev/prod
# boundary. Do not reintroduce a prod-serving bin in this crate.

# `ssr` (default on) carries the in-process V8 runtime (mesofact-ssr →
# deno_core → prebuilt librusty_v8), forwarded to the facade. Static/SPA-only
# consumers can build with `--no-default-features` and skip the V8 toolchain
# entirely — the same posture the bun era guaranteed, carried over to the V8
# era. Without `ssr`, `mode:"ssr"` routes are not dispatchable; static serving,
# the SPA hydrate path, the same-origin reverse proxy, the watcher, and the dev
# S3 surface are all unaffected.
[features]
default = ["ssr"]
# Forwards to the facade's `ssr` tier (runtime + revalidate receiver). The
# publisher dep stays direct: the dev S3 smoke test drives S3Store itself.
ssr = ["mesofact/ssr", "dep:mesofact-publisher"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "time", "sync", "io-util", "net"] }
# Dev-tier S3 surface (R490-F7): FS-backed s3s-fs so a workload's
# @mesofact/runtime R2Adapter resolves against a local bucket in `bun run dev`.
# Apache-2.0; resolves cleanly here (the R274-F5 sha1/iroh-relay conflict is
# camp-only — absent from mesofact-dev's tree).
s3s = "0.13"
s3s-fs = "0.13"
# Impl of s3s::access::S3Access for the dev-S3 surface (async-trait method).
async-trait = "0.1"
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The serving engine. This crate is now a thin dev-affordance layer ON TOP of
# the facade rather than the crate that owned the engine (W225 §2a).
mesofact = { path = "../mesofact", version = "0.8.21", default-features = false }
# Direct publisher dep for the dev-S3 round-trip test (drives S3Store itself).
mesofact-publisher = { path = "../mesofact-publisher", optional = true }
# HTTP client for the dev S3 round-trip. Loopback http://127.0.0.1 only — no TLS.
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
