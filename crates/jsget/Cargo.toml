# The ecosystem-plural acquisition facade over the npm-shaped resolver in
# `rnpm`. W318 §9: the facade earns its keep as registry plurality — base URL,
# auth, name mangling — NOT as a slot for a second resolution algorithm.
#
# WORKING TITLE ONLY (R757: name it on the way out). `publish = false` keeps a
# placeholder name off crates.io until then.

[package]
name = "jsget"
description = "Ecosystem-plural JS package acquisition facade (working title — see R757)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rnpm = { path = "../rnpm", version = "0.8.40" }

anyhow = "1"

[dev-dependencies]
# The `testing` feature exposes `rnpm::testing::FakeTransport`, so the
# no-network-on-a-warm-cache proof is made against the same fake `rnpm` uses
# rather than a second one that could drift from it.
rnpm = { path = "../rnpm", version = "0.8.40", features = ["testing"] }
serde_json = "1"
tempfile = "3"
