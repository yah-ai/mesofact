# deno_core-hosted JS runtime shared by mesofact-build (SSG, one-shot render)
# and mesofact-dev (long-lived SSR dispatch). Extracted from mesofact-build so
# the dev-tier subprocess can be replaced with an in-process dispatch call
# (W174 pillar 4, R449-F2). The SSR Fetch API is a pure-JS shim over one
# reqwest-backed op (R750-F1 — no deno extension crates); the SSG path keeps
# using the lean polyfill bootstrap (build-time only, no I/O).

[package]
name = "mesofact-ssr"
description = "deno_core-hosted JS runtime for mesofact SSG + dev-tier SSR dispatch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# https:// for SSR fetch(), same reqwest backend as mesofact-core. Enabled by
# mesofact's `ssr` feature; off by default (standalone is http-only).
tls = ["reqwest/rustls-tls"]

[dependencies]
deno_core = "0.404"
# op2 error type; pinned to the exact version deno_core 0.404 uses.
deno_error = "=0.7.1"
# Backs op_mesofact_fetch (R750-F1). http-only by default so the lean closure
# carries no TLS stack; the `tls` feature adds mesofact-core's backend.
reqwest = { version = "0.12", default-features = false }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
