# `cross` configuration for the mesofact release builds (R560-F1).
#
# oss/mesofact is an independent Cargo workspace (excluded from the yah root
# workspace), so `cross` run from here resolves THIS config — not the yah-root
# Cross.toml. Two settings, both load-bearing; without either, the two
# `*-unknown-linux-gnu` legs of release.yml's `mesofact-build` job fail.
#
# ── Repo-root volume ────────────────────────────────────────────────────────
# mesofact has path deps that ESCAPE its own workspace dir:
#
#   crates/mesofact/Cargo.toml        yah-mesofact-bundle → ../../../yah-base/…
#   crates/mesofact-build/Cargo.toml  yah-mesofact-bundle → ../../../yah-base/…
#   crates/mesofact-core/Cargo.toml   cheers-core, cheers-server → ../../../cheers/…
#
# Those resolve to `oss/yah-base` and `oss/cheers` — SIBLING workspaces. cross
# mounts only the current workspace dir into the build container by default, so
# those paths (and the sibling `Cargo.toml`s they inherit from) fall outside the
# mount and the build dies with "failed to find a workspace root". Bind-mounting
# the whole repo at its real path makes the siblings visible. Same mechanism and
# same reason as oss/yubaba/Cross.toml's ../qed mount — keep them in sync.
#
# YAH_REPO_ROOT is set to the repo root by the `mesofact-build` job in
# .github/workflows/release.yml. A local `cross` run must export it too.
[build.env]
volumes = ["YAH_REPO_ROOT"]

# ── Image pins ──────────────────────────────────────────────────────────────
# Pinned to `:main`, NOT the version-derived `:0.2.5` images: the 0.2.5 images
# are Ubuntu 16.04 / glibc 2.23 (measured 2026-07-24), far too old to execute a
# modern Rust toolchain's own binaries — and rust-toolchain.toml here pins
# channel 1.97.0 (R560-T2, needed for oxc_transformer).
#
# DO NOT read a glibc-compatibility benefit into this. Measured 2026-07-24:
#
#   ghcr.io/cross-rs/{x86_64,aarch64}-unknown-linux-gnu:main  Ubuntu 24.04, glibc 2.39
#   ghcr.io/cross-rs/x86_64-unknown-linux-gnu:0.2.5           Ubuntu 16.04, glibc 2.23
#
# 2.39 is exactly what a native `ubuntu-latest` build gives, so cross buys the
# gnu legs NOTHING on the compatibility axis — and cross publishes no image in
# between. An earlier revision of this file (and of release.yml's job comment)
# claimed `:main` was Ubuntu 20.04 / glibc 2.31 and justified the cross routing
# on that basis; that was wrong, inherited from a now-stale comment in
# oss/yubaba/Cross.toml. The real, measured floor of the produced binary is
# GLIBC_2.39, which does not run on Debian 12 (2.36), Ubuntu 22.04 (2.35), or
# RHEL 9 / Amazon Linux 2023 (2.34). Tracked as R639 — expect these two target
# blocks to be REPLACED by an explicit-floor toolchain (cargo-zigbuild) rather
# than tuned.
#
# What cross IS still buying here: a working aarch64-unknown-linux-gnu
# cross-compile from an x86_64 runner without hand-managing a sysroot.
#
# No pre-build hooks: unlike oss/yubaba, nothing here needs protoc (no
# prost/tonic in the graph) or nasm (no rav1e / `all-image`). The `v8` crate
# downloads its prebuilt librusty_v8.a from within its own build script, which
# carries its own TLS stack and root certs, so no curl/ca-certificates hook is
# needed either — verified 2026-07-24 by a real build (183,580,304-byte
# librusty_v8.a fetched, zero .ninja files, 105s wall-clock).
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
